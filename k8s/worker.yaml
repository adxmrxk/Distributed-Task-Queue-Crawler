apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: crawler
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: crawler-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: APP_NAME
              value: "Distributed Web Crawler"
            - name: DEBUG
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
