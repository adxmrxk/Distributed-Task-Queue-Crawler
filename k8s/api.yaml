apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: crawler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: crawler-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: APP_NAME
              value: "Distributed Web Crawler"
            - name: DEBUG
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: crawler
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Exposes the API outside the cluster (use LoadBalancer on real cloud, NodePort locally)
apiVersion: v1
kind: Service
metadata:
  name: api-external
  namespace: crawler
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
