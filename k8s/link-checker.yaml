apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-checker
  namespace: crawler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: link-checker
  template:
    metadata:
      labels:
        app: link-checker
    spec:
      containers:
        - name: link-checker
          image: crawler-link-checker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: link_check_jobs
            - name: KAFKA_GROUP_ID
              value: link-checker-group
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
