global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: crawler_api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9540"]

  - job_name: link_checker
    static_configs:
      - targets: ["link_checker:9091"]
    metrics_path: /metrics
