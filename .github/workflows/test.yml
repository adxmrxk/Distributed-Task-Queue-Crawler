name: Tests & Lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  python:
    name: Python — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.7.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Run tests
        run: poetry run pytest tests/ --tb=short -q

  go:
    name: Go — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/link_checker/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: services/link_checker
          version: v1.57.2

      - name: Run Go tests
        working-directory: services/link_checker
        run: go test ./... -v -race
